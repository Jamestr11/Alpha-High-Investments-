<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deposits · AlphaX Invest</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../js/seed.js"></script>
    <script src="../js/market.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/chart.js"></script>
    <script src="../js/app.js"></script>
    <script>
      (function () {
        var App = window.AlphaXApp;
        var Store = window.AlphaXStore;

        App.scriptsReady(function () {
          var user = App.requireUser(["STUDENT", "ADMIN", "GUIDE"]);
          if (!user) return;
          var main = App.mountShell({ user: user, active: "deposits" });
          var state = Store.load();
          var students = state.users
            .filter(function (u) {
              return u.role === "STUDENT";
            })
            .sort(function (a, b) {
              return a.name.localeCompare(b.name);
            });

          var deposits =
            user.role === "STUDENT"
              ? state.deposits.filter(function (d) {
                  return d.studentId === user.id;
                })
              : state.deposits.slice(0, 40);

          var staffForm =
            user.role === "ADMIN" || user.role === "GUIDE"
              ? '<div class="panel fade-up" style="padding:1rem;margin-bottom:1rem">' +
                '<h2 class="display" style="margin:0 0 0.75rem;font-size:1.15rem">Post deposit / adjustment</h2>' +
                '<form id="dep-form" class="stack">' +
                '<div class="field"><label for="student">Student</label><select id="student" name="student" required>' +
                students
                  .map(function (s) {
                    return (
                      '<option value="' +
                      s.id +
                      '">' +
                      App.escapeHtml(s.name) +
                      " · " +
                      App.formatAlphaX(s.balance) +
                      "</option>"
                    );
                  })
                  .join("") +
                "</select></div>" +
                '<div class="field"><label for="amount">Amount (αX)</label>' +
                '<input id="amount" name="amount" type="number" step="1" required placeholder="e.g. 25 or -10" />' +
                '<p class="hint">Positive credits the student; negative debits. Artificial AlphaX only.</p></div>' +
                '<div class="field"><label for="note">Note</label>' +
                '<input id="note" name="note" type="text" placeholder="Emporium shift / class reward" /></div>' +
                '<button type="submit" class="btn btn-primary">Save deposit</button></form></div>'
              : "";

          main.innerHTML =
            App.demoBanner() +
            '<div class="section-head"><div><h2 class="display">Deposits</h2>' +
            "<p>" +
            (user.role === "STUDENT"
              ? "Your AlphaX credit history (staff posts these)."
              : "Guides & James can credit or debit student AlphaX balances.") +
            "</p></div></div>" +
            staffForm +
            '<div class="panel table-wrap" id="table"></div>';

          if (user.role !== "STUDENT") {
            document.getElementById("dep-form").addEventListener("submit", function (e) {
              e.preventDefault();
              var form = e.target;
              var res = Store.addDeposit(
                user.id,
                form.student.value,
                form.amount.value,
                form.note.value
              );
              if (!res.ok) {
                App.toast(res.error, "error");
                return;
              }
              App.toast("Deposit saved. New balance " + App.formatAlphaX(res.balance), "ok");
              location.reload();
            });
          }

          var table = document.getElementById("table");
          if (!deposits.length) {
            table.innerHTML =
              '<div class="empty"><strong>No deposits yet</strong>' +
              (user.role === "STUDENT"
                ? "Ask a guide or James to post AlphaX."
                : "Post the first credit above.") +
              "</div>";
            return;
          }

          table.innerHTML =
            '<table class="okx-table"><thead><tr><th>When</th>' +
            (user.role === "STUDENT" ? "" : "<th>Student</th>") +
            "<th>Amount</th><th>Note</th><th>By</th></tr></thead><tbody>" +
            deposits
              .map(function (d) {
                var student = state.users.find(function (u) {
                  return u.id === d.studentId;
                });
                var by = state.users.find(function (u) {
                  return u.id === d.byUserId;
                });
                return (
                  "<tr><td>" +
                  App.formatDateTime(d.at) +
                  "</td>" +
                  (user.role === "STUDENT"
                    ? ""
                    : "<td>" +
                      App.escapeHtml(student ? student.name : "?") +
                      "</td>") +
                  '<td class="mono ' +
                  (d.amount >= 0 ? "up" : "down") +
                  '">' +
                  App.formatAlphaX(d.amount) +
                  "</td><td>" +
                  App.escapeHtml(d.note || "—") +
                  "</td><td>" +
                  App.escapeHtml(by ? by.name : "?") +
                  "</td></tr>"
                );
              })
              .join("") +
            "</tbody></table>";
        });
      })();
    </script>
  </body>
</html>
