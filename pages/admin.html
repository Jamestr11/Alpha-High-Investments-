<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox · AlphaX Invest</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../js/seed.js"></script>
    <script src="../js/market.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/chart.js"></script>
    <script src="../js/app.js"></script>
    <script>
      (function () {
        var App = window.AlphaXApp;
        var Store = window.AlphaXStore;

        App.scriptsReady(function () {
          var user = App.requireUser(["ADMIN"]);
          if (!user) return;
          var main = App.mountShell({ user: user, active: "admin" });
          var state = Store.load();

          var pending = state.requests.filter(function (r) {
            return r.status === "PENDING";
          });
          var decided = state.requests
            .filter(function (r) {
              return r.status !== "PENDING";
            })
            .slice(0, 12);

          main.innerHTML =
            App.demoBanner() +
            '<div class="stats fade-up">' +
            '<div class="stat panel"><div class="label">Pending requests</div><div class="value mono">' +
            pending.length +
            '</div><div class="hint">James decides</div></div>' +
            '<div class="stat panel"><div class="label">Active holdings</div><div class="value mono">' +
            state.holdings.length +
            "</div></div>" +
            "</div>" +
            '<div class="section-head"><div><h2 class="display">Invest requests inbox</h2>' +
            "<p>Approve creates a holding and logs a mock CFO notify. Reject with optional reason.</p></div></div>" +
            '<div id="inbox" class="stack"></div>' +
            '<div class="section-head"><div><h2 class="display">Recently decided</h2></div></div>' +
            '<div class="panel table-wrap" id="decided"></div>';

          var inbox = document.getElementById("inbox");
          if (!pending.length) {
            inbox.innerHTML =
              '<div class="panel empty"><strong>Inbox clear</strong>Student invest orders land here for approval.</div>';
          } else {
            pending.forEach(function (r) {
              var student = state.users.find(function (u) {
                return u.id === r.studentId;
              });
              var fund = state.funds.find(function (f) {
                return f.id === r.fundId;
              });
              var card = document.createElement("div");
              card.className = "panel fade-up";
              card.style.padding = "1rem";
              card.innerHTML =
                '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:0.75rem">' +
                "<div><p class=\"display\" style=\"margin:0;font-size:1.15rem\">" +
                App.escapeHtml(student ? student.name : "?") +
                '</p><p style="margin:0.35rem 0 0;color:var(--ink-soft)">' +
                App.escapeHtml(fund ? fund.symbol || fund.name : "?") +
                ' · <span class="mono" style="color:var(--ink);font-weight:600">' +
                App.formatAlphaX(r.amount) +
                "</span></p>" +
                '<p class="hint" style="margin:0.35rem 0 0">' +
                App.formatDateTime(r.createdAt) +
                " · lock " +
                r.lockWeeks +
                "w @ " +
                r.weeklyReturnPercent +
                "%/wk</p></div>" +
                '<span class="badge pending">PENDING</span></div>' +
                '<div class="row-actions">' +
                '<button type="button" class="btn btn-primary" data-act="approve" data-id="' +
                r.id +
                '">Approve</button>' +
                '<button type="button" class="btn btn-danger" data-act="reject" data-id="' +
                r.id +
                '">Reject</button>' +
                "</div>";
              inbox.appendChild(card);
            });
          }

          inbox.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-act]");
            if (!btn) return;
            var id = btn.getAttribute("data-id");
            var act = btn.getAttribute("data-act");
            var reason = null;
            if (act === "reject") {
              reason = prompt("Reject reason (optional):", "") || "";
            }
            var res = Store.decideRequest(id, user.id, act === "approve", reason);
            if (!res.ok) {
              App.toast(res.error, "error");
              return;
            }
            App.toast(
              act === "approve" ? "Approved — holding created." : "Rejected.",
              "ok"
            );
            location.reload();
          });

          var decidedEl = document.getElementById("decided");
          if (!decided.length) {
            decidedEl.innerHTML =
              '<div class="empty"><strong>No decisions yet</strong></div>';
          } else {
            decidedEl.innerHTML =
              '<table class="okx-table"><thead><tr><th>Student</th><th>Fund</th><th>Amount</th><th>Status</th><th>When</th></tr></thead><tbody>' +
              decided
                .map(function (r) {
                  var student = state.users.find(function (u) {
                    return u.id === r.studentId;
                  });
                  var fund = state.funds.find(function (f) {
                    return f.id === r.fundId;
                  });
                  return (
                    "<tr><td>" +
                    App.escapeHtml(student ? student.name : "?") +
                    "</td><td>" +
                    App.escapeHtml(fund ? fund.symbol || fund.name : "?") +
                    '</td><td class="mono">' +
                    App.formatAlphaX(r.amount) +
                    '</td><td><span class="badge ' +
                    r.status.toLowerCase() +
                    '">' +
                    r.status +
                    "</span>" +
                    (r.reason
                      ? '<div class="hint">' + App.escapeHtml(r.reason) + "</div>"
                      : "") +
                    "</td><td>" +
                    App.formatDateTime(r.decidedAt) +
                    "</td></tr>"
                  );
                })
                .join("") +
              "</tbody></table>";
          }
        });
      })();
    </script>
  </body>
</html>
