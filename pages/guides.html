<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guides · AlphaX Invest</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../js/seed.js"></script>
    <script src="../js/market.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/chart.js"></script>
    <script src="../js/app.js"></script>
    <script>
      (function () {
        var App = window.AlphaXApp;
        var Store = window.AlphaXStore;

        App.scriptsReady(function () {
          var user = App.requireUser(["STUDENT", "ADMIN", "GUIDE"]);
          if (!user) return;
          var main = App.mountShell({ user: user, active: "guides" });
          var state = Store.load();
          user = Store.getSession();
          var acked =
            user.termsAckVersion &&
            user.termsAckVersion === state.settings.termsVersion;

          main.innerHTML =
            App.demoBanner() +
            '<div class="section-head"><div><h2 class="display">Guides &amp; terms</h2>' +
            "<p>Logan &amp; Michael oversee Emporium sheets. This demo does not sync Google Sheets.</p></div></div>" +
            '<div class="panel fade-up" style="padding:0.75rem">' +
            '<p class="eyebrow" style="margin:0">Terms v' +
            App.escapeHtml(state.settings.termsVersion) +
            "</p>" +
            '<pre style="white-space:pre-wrap;font-family:var(--font-body);font-size:0.9rem;color:var(--ink-soft);margin:0.85rem 0 1rem;line-height:1.55">' +
            App.escapeHtml(state.settings.termsText) +
            "</pre>" +
            (acked
              ? '<p class="hint">You acknowledged these terms (v' +
                App.escapeHtml(user.termsAckVersion) +
                ").</p>"
              : '<button type="button" class="btn btn-primary" id="ack">I acknowledge</button>') +
            "</div>" +
            '<div class="section-head"><div><h2 class="display">Fund map</h2>' +
            "<p>James’s roster — artificial AlphaX only.</p></div></div>" +
            '<div class="panel table-wrap"><table class="okx-table"><thead><tr>' +
            "<th>Fund</th><th>Personality</th><th>Drift</th><th>β</th><th>Vol</th><th>Health</th>" +
            "</tr></thead><tbody>" +
            state.funds
              .slice()
              .sort(function (a, b) {
                return a.sortOrder - b.sortOrder;
              })
              .map(function (f) {
                return (
                  "<tr><td>" +
                  App.escapeHtml(f.name) +
                  (f.required
                    ? ' <span class="badge warn">Required</span>'
                    : "") +
                  "</td><td>" +
                  App.escapeHtml(f.personality || "—") +
                  '</td><td class="mono">' +
                  f.baseGrowthRate +
                  '%</td><td class="mono">' +
                  f.beta +
                  '</td><td class="mono">' +
                  f.volatility +
                  '</td><td class="mono">' +
                  f.projectHealth +
                  "</td></tr>"
                );
              })
              .join("") +
            "</tbody></table></div>" +
            '<p class="footer-note">CFO mock log (latest): ' +
            (state.cfoLog[0]
              ? App.escapeHtml(state.cfoLog[0].event) +
                " @ " +
                App.formatDateTime(state.cfoLog[0].at)
              : "none yet") +
            "</p>";

          var ackBtn = document.getElementById("ack");
          if (ackBtn) {
            ackBtn.addEventListener("click", function () {
              var res = Store.ackTerms(user.id);
              if (!res.ok) {
                App.toast(res.error, "error");
                return;
              }
              App.toast("Terms acknowledged.", "ok");
              location.reload();
            });
          }
        });
      })();
    </script>
  </body>
</html>
