<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallet · AlphaX Invest</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../js/seed.js"></script>
    <script src="../js/market.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/chart.js"></script>
    <script src="../js/app.js"></script>
    <script>
      (function () {
        var App = window.AlphaXApp;
        var Store = window.AlphaXStore;
        var Market = window.AlphaXMarket;
        var Chart = window.AlphaXChart;

        App.scriptsReady(function () {
          var user = App.requireUser(["STUDENT"]);
          if (!user) return;
          var main = App.mountShell({ user: user, active: "student" });
          var state = Store.load();
          user = Store.getSession();

          var reserved = Store.pendingReserved(user.id);
          var available = Store.availableBalance(user.id);
          var holdings = state.holdings
            .filter(function (h) {
              return h.studentId === user.id;
            })
            .map(function (h) {
              return Store.enrichHolding(h);
            })
            .filter(Boolean);
          var invested = holdings.reduce(function (s, h) {
            return s + h.holding.amountInvested;
          }, 0);
          var current = holdings.reduce(function (s, h) {
            return s + h.currentValue;
          }, 0);
          var totalEquity = Math.round((available + current) * 100) / 100;
          var pnl = Math.round((current - invested) * 100) / 100;

          var funds = state.funds
            .slice()
            .sort(function (a, b) {
              return a.sortOrder - b.sortOrder;
            });

          main.innerHTML =
            App.demoBanner() +
            '<section class="wallet-hero fade-up">' +
            '<div class="wallet-label">Total αX balance</div>' +
            '<div class="wallet-total mono">' +
            App.formatAlphaXPlain(totalEquity) +
            '<span class="unit">αX</span></div>' +
            '<div class="wallet-sub">' +
            '<div class="wallet-chip"><div class="label">Available</div>' +
            '<div class="value">' +
            App.formatAlphaXPlain(available) +
            '</div><div class="hint">Cash αX' +
            (reserved ? " · reserved " + App.formatAlphaXPlain(reserved) : "") +
            "</div></div>" +
            '<div class="wallet-chip"><div class="label">Invested αX</div>' +
            '<div class="value ' +
            (pnl >= 0 ? "up" : "down") +
            '">' +
            App.formatAlphaXPlain(current) +
            '</div><div class="hint">Cost ' +
            App.formatAlphaXPlain(invested) +
            " · P&amp;L " +
            App.formatAlphaXPlain(pnl) +
            "</div></div></div></section>" +
            '<div id="ticker"></div>' +
            '<div class="section-head"><div><h2 class="display"><span class="live-dot"></span>Markets</h2>' +
            "<p>Live ticks · SPY · BTC · ETH · SOL · BNB · XRP</p></div></div>" +
            '<div class="fund-grid" id="funds"></div>' +
            '<div class="section-head"><div><h2 class="display">What you own</h2>' +
            "<p>Mark-to-market · locked until unlock</p></div></div>" +
            '<div class="holdings-list" id="owned"></div>' +
            '<div class="section-head"><div><h2 class="display">Recent requests</h2>' +
            "<p>James approves · pending αX reserved</p></div></div>" +
            '<div class="panel table-wrap" id="requests"></div>';

          App.renderTicker(document.getElementById("ticker"));

          var fundsEl = document.getElementById("funds");
          funds.forEach(function (f) {
            var card = document.createElement("article");
            card.className = "fund-card panel fade-up";
            var sym = f.symbol || f.name;
            card.innerHTML =
              "<header><div><h3 class=\"display\"><span class=\"sym\">" +
              App.escapeHtml(sym) +
              "</span>" +
              (f.required
                ? ' <span class="badge warn">Required</span>'
                : "") +
              '</h3><p class="hint" style="margin:4px 0 0">' +
              App.escapeHtml(f.description) +
              "</p></div>" +
              '<div class="mono live-price" data-live-price>—</div></header>' +
              '<div class="fund-meta">' +
              "<span><strong>Style</strong> " +
              App.escapeHtml(f.personality || "—") +
              "</span>" +
              "<span><strong>Drift</strong> " +
              f.baseGrowthRate +
              "%/wk</span>" +
              "<span><strong>β</strong> " +
              f.beta +
              "</span>" +
              "<span><strong>Vol</strong> " +
              f.volatility +
              "</span>" +
              "</div>" +
              '<div class="chart-box" data-chart></div>' +
              '<form class="row-actions invest-form" data-fund="' +
              f.id +
              '">' +
              '<div class="field" style="flex:1;min-width:110px">' +
              '<label for="amt-' +
              f.id +
              '">Amount (αX)</label>' +
              '<input id="amt-' +
              f.id +
              '" type="text" inputmode="decimal" autocomplete="off" name="amount" placeholder="' +
              state.settings.minDeposit +
              '+" />' +
              "</div>" +
              '<button type="submit" class="btn btn-primary invest-submit" style="align-self:end;min-height:2.15rem;min-width:6.5rem">Invest</button>' +
              "</form>";
            fundsEl.appendChild(card);
            Chart.live(
              card.querySelector("[data-chart]"),
              f,
              112,
              Store.popularityBump(f.id)
            );
          });

          function handleInvestSubmit(form) {
            var amountInput = form.querySelector('[name="amount"]');
            var amount = amountInput ? String(amountInput.value).trim() : "";
            if (!amount) {
              App.toast("Enter an AlphaX amount first.", "error");
              if (amountInput) amountInput.focus();
              return false;
            }
            var res = Store.submitInvest(
              user.id,
              form.getAttribute("data-fund"),
              amount
            );
            if (!res.ok) {
              App.toast(res.error, "error");
              return false;
            }
            App.toast("Invest request submitted — waiting on James.", "ok");
            location.reload();
            return true;
          }

          fundsEl.querySelectorAll(".invest-form").forEach(function (form) {
            form.addEventListener("submit", function (e) {
              e.preventDefault();
              handleInvestSubmit(form);
            });
            var btn = form.querySelector(".invest-submit");
            if (btn) {
              btn.addEventListener("click", function (e) {
                e.preventDefault();
                handleInvestSubmit(form);
              });
            }
          });

          var owned = document.getElementById("owned");
          if (!holdings.length) {
            owned.innerHTML =
              '<div class="panel empty"><strong>No positions yet</strong>Invest in a market below — James must approve.</div>';
          } else {
            owned.innerHTML = holdings
              .map(function (r) {
                var sym = r.fund.symbol || r.fund.name;
                return (
                  '<div class="holding-row fade-up">' +
                  '<div class="sym">' +
                  App.escapeHtml(sym) +
                  (r.fund.required
                    ? ' <span class="badge warn">Req</span>'
                    : "") +
                  "</div>" +
                  '<div class="mark ' +
                  (r.pnl >= 0 ? "up" : "down") +
                  '">' +
                  App.formatAlphaX(r.currentValue) +
                  "</div>" +
                  '<div class="meta"><span>Cost ' +
                  App.formatAlphaX(r.holding.amountInvested) +
                  "</span><span>P&amp;L " +
                  App.formatAlphaX(r.pnl) +
                  "</span><span>" +
                  r.weeksApplied +
                  "/" +
                  r.holding.lockWeeks +
                  "w</span><span>Unlock " +
                  App.formatDate(r.holding.unlockDate) +
                  "</span></div></div>"
                );
              })
              .join("");
          }

          var reqs = state.requests
            .filter(function (r) {
              return r.studentId === user.id;
            })
            .slice(0, 8);
          var reqEl = document.getElementById("requests");
          if (!reqs.length) {
            reqEl.innerHTML =
              '<div class="empty"><strong>No requests yet</strong>Pick a market and lock some AlphaX.</div>';
          } else {
            reqEl.innerHTML =
              '<table class="okx-table"><thead><tr><th>When</th><th>Mkt</th><th>Amount</th><th>Status</th></tr></thead><tbody>' +
              reqs
                .map(function (r) {
                  var fund = state.funds.find(function (f) {
                    return f.id === r.fundId;
                  });
                  return (
                    "<tr><td>" +
                    App.formatDateTime(r.createdAt) +
                    '</td><td class="mono">' +
                    App.escapeHtml(fund ? fund.symbol || fund.name : "?") +
                    '</td><td class="mono">' +
                    App.formatAlphaX(r.amount) +
                    '</td><td><span class="badge ' +
                    r.status.toLowerCase() +
                    '">' +
                    r.status +
                    "</span></td></tr>"
                  );
                })
                .join("") +
              "</tbody></table>";
          }
        });
      })();
    </script>
  </body>
</html>
